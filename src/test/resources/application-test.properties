# Configuración exclusiva para pruebas.
# Sustituye la conexión a Oracle por una base de datos H2 en memoria,
# para que las pruebas puedan correr en CUALQUIER máquina sin .env ni Oracle instalado.

spring.datasource.url=jdbc:h2:mem:escuela-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# A diferencia de producción (ddl-auto=validate), aquí Hibernate crea el esquema
# a partir de tus @Entity y lo destruye al terminar.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Evita "Could not resolve placeholder 'PORT'": 0 = puerto libre aleatorio.
server.port=0
